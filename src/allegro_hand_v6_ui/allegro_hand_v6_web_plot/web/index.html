<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Allegro Hand V6 Monitor</title>
<style>
:root{--bg:#fff;--panel:#f5f7fb;--fg:#1a2233;--muted:#6b7384;--navy:#16357d;--blue:#1d5bb8;--red:#d23b3b;--border:#e2e7f0}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}header{height:60px;padding:10px 24px;background:#fff;display:flex;align-items:center;gap:16px;border-bottom:2px solid var(--navy)}header h1{font-size:16px;margin:0;font-weight:650;color:var(--navy)}header .spacer{flex:1}header img{height:34px;width:auto}.tabs{display:flex;gap:6px}.tabs button,.btns button{background:#fff;color:var(--navy);border:1px solid var(--navy);border-radius:6px;padding:6px 16px;font-size:13px;font-weight:600;cursor:pointer}.tabs button.active{background:var(--navy);color:#fff}#status{font-size:13px;color:var(--muted)}#status.ok{color:var(--blue);font-weight:600}#status.bad{color:var(--red);font-weight:600}.layout{display:flex;height:calc(100vh - 60px)}aside{width:230px;background:var(--panel);padding:14px;overflow-y:auto;border-right:1px solid var(--border);flex:none}aside h2{font-size:12px;letter-spacing:.06em;color:var(--navy);margin:0 0 10px}.btns{display:flex;gap:6px;margin-bottom:10px}.btns button{flex:1;padding:5px}.jgroup{border:1px solid var(--border);border-radius:8px;padding:6px;margin-bottom:10px;background:#fff}.jgroup-head{display:flex;align-items:center;gap:8px;padding:4px 6px;margin-bottom:4px;font-size:12px;font-weight:700;color:var(--navy);border-bottom:1px solid var(--border)}.joint{display:flex;align-items:center;gap:8px;padding:5px 6px;font-size:13px}.joint input,.jgroup input{accent-color:var(--navy)}.swatch{width:11px;height:11px;border-radius:2px}main{flex:1;padding:14px;overflow:auto}.legend{font-size:12px;color:var(--muted);margin-bottom:8px}.legend b{color:var(--navy)}canvas{display:block;width:100%;height:calc(100vh - 105px)}.sensor-view{display:none}.sensor-view.active{display:block}.chart-view.hidden{display:none}.bars{display:flex;gap:14px;margin-bottom:24px;align-items:stretch;flex-wrap:wrap}.finger{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px;flex:1;min-width:155px}.finger h3{margin:0 0 10px;font-size:13px;color:var(--navy);text-align:center}.bar-row{display:flex;align-items:flex-end;gap:7px;height:190px}.bar-cell{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}.bar-track{width:100%;height:145px;background:#e9eef7;border-radius:4px;display:flex;align-items:flex-end;overflow:hidden}.bar-fill{width:100%;background:var(--navy);transition:height .05s}.bar-val{font-size:10px;margin-top:4px}.bar-lbl{font-size:9px;color:var(--muted);margin-top:2px}.waiting{text-align:center;color:var(--muted);padding:80px 10px}@media(max-width:900px){header img{display:none}.tabs button{padding:6px 8px}aside{width:205px}}
</style></head><body>
<header><h1 id="title">Allegro Hand V6 · Joint Angles (rad)</h1><div class="tabs"><button data-mode="position" class="active">Angles</button><button data-mode="current">Current</button><button data-mode="temperature">Temperature</button><button data-mode="pressure">Sensors</button></div><span id="status">connecting…</span><span class="spacer"></span><img src="WR_EN_high.png" alt="WONIK ROBOTICS" onerror="this.hidden=true"></header>
<div class="layout"><aside id="sidebar"><h2>JOINTS</h2><div class="btns"><button id="all">All</button><button id="none">None</button></div><div id="jointList"></div></aside><main>
<div id="chartView" class="chart-view"><div id="legend" class="legend">solid = <b>current</b> · dashed = <b>desired</b> · window: <b>10s</b></div><canvas id="chart"></canvas></div>
<div id="sensorView" class="sensor-view"><div id="pressureWaiting" class="waiting">Waiting for /allegro_hand_v6/tactile_sensors</div><div id="bars" class="bars"></div></div>
</main></div>
<script>
const DOF=20,WINDOW=10000,PALETTE=['#16357d','#d23b3b','#1d8a4e','#e08a00','#7e3fc2','#c2185b','#1d5bb8','#8a8d00','#d2521f','#0097a7','#558b2f','#b71c5b','#5e35b1','#0277bd','#ef6c00','#2e7d32','#8d3f22','#00695c','#6a1b9a','#455a64'];
const GROUPS=[{name:'Thumb',idx:[0,1,2,3]},{name:'Index',idx:[4,5,6,7]},{name:'Middle',idx:[8,9,10,11]},{name:'Ring',idx:[12,13,14,15]},{name:'Pinky',idx:[16,17,18,19]}];
let names=Array.from({length:DOF},(_,i)=>`joint_${i}`),selected=new Set([0,1,2,3]),latest={},history=[],mode='position';
function buildJointList(){let root=document.getElementById('jointList');root.innerHTML='';GROUPS.forEach(g=>{let box=document.createElement('div');box.className='jgroup';box.innerHTML=`<label class="jgroup-head"><input type="checkbox" ${g.idx.every(i=>selected.has(i))?'checked':''}><span>${g.name}</span></label>`;let head=box.querySelector('input');head.onchange=()=>{g.idx.forEach(i=>head.checked?selected.add(i):selected.delete(i));buildJointList();draw()};g.idx.forEach(i=>{let row=document.createElement('label');row.className='joint';row.innerHTML=`<input type="checkbox" ${selected.has(i)?'checked':''}><span class="swatch" style="background:${PALETTE[i]}"></span><span>${names[i]||`joint_${i}`}</span>`;row.querySelector('input').onchange=e=>{e.target.checked?selected.add(i):selected.delete(i);draw()};box.appendChild(row)});root.appendChild(box)})}
document.getElementById('all').onclick=()=>{selected=new Set(Array.from({length:DOF},(_,i)=>i));buildJointList();draw()};document.getElementById('none').onclick=()=>{selected.clear();buildJointList();draw()};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));let sensor=mode==='pressure';document.getElementById('sidebar').style.display=sensor?'none':'';document.getElementById('chartView').classList.toggle('hidden',sensor);document.getElementById('sensorView').classList.toggle('active',sensor);let titles={position:'Joint Angles (rad)',current:'Motor Current (Nm)',temperature:'Joint Temperature (°C)',pressure:'Tactile Sensors'};document.getElementById('title').textContent=`Allegro Hand V6 · ${titles[mode]}`;document.getElementById('legend').innerHTML=mode==='position'?'solid = <b>current</b> · dashed = <b>desired</b> · window: <b>10s</b>':`20-joint ${titles[mode].toLowerCase()} · window: <b>10s</b>`;draw();renderPressure()});
function finiteValues(){let out=[];history.forEach(q=>{let a=mode==='position'?q.position:q[mode];if(a)a.forEach((v,i)=>{if(selected.has(i)&&Number.isFinite(v))out.push(v)});if(mode==='position'&&q.desired)q.desired.forEach((v,i)=>{if(selected.has(i)&&Number.isFinite(v))out.push(v)})});return out}
function draw(){if(mode==='pressure')return;let c=document.getElementById('chart'),d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;if(!w||!h)return;c.width=w*d;c.height=h*d;let x=c.getContext('2d');x.scale(d,d);x.clearRect(0,0,w,h);let vals=finiteValues(),lo=Math.min(-.1,...vals),hi=Math.max(.1,...vals),pad=(hi-lo)*.08||.1;lo-=pad;hi+=pad;for(let k=0;k<6;k++){let y=k*h/5;x.strokeStyle='#e2e7f0';x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke();x.fillStyle='#6b7384';x.font='11px system-ui';x.fillText((hi-(hi-lo)*k/5).toFixed(mode==='temperature'?0:2),4,Math.max(11,y-3))}selected.forEach(j=>{plotLine(x,w,h,j,mode==='position'?'position':mode,lo,hi,false);if(mode==='position')plotLine(x,w,h,j,'desired',lo,hi,true)})}
function plotLine(x,w,h,j,key,lo,hi,dashed){x.strokeStyle=PALETTE[j];x.lineWidth=1.5;x.setLineDash(dashed?[6,4]:[]);x.beginPath();let begun=false;history.forEach((q,k)=>{let v=q[key]&&q[key][j];if(!Number.isFinite(v))return;let px=k*w/Math.max(1,history.length-1),py=h-(v-lo)/(hi-lo)*h;if(!begun){x.moveTo(px,py);begun=true}else x.lineTo(px,py)});x.stroke();x.setLineDash([])}
function renderPressure(){if(mode!=='pressure')return;let p=latest.pressure;if(!p){document.getElementById('pressureWaiting').style.display='block';document.getElementById('bars').innerHTML='';return}document.getElementById('pressureWaiting').style.display='none';let base=Math.floor(p.length/5),extra=p.length%5,start=0;document.getElementById('bars').innerHTML=GROUPS.map((g,gi)=>{let n=base+(gi<extra?1:0),idx=Array.from({length:n},(_,k)=>start+k);start+=n;return `<div class="finger"><h3>${g.name}</h3><div class="bar-row">${idx.map(i=>{let v=p[i],pct=Number.isFinite(v)?Math.max(0,Math.min(100,v/30*100)):0;return `<div class="bar-cell"><div class="bar-track"><div class="bar-fill" style="height:${pct}%"></div></div><div class="bar-val">${Number.isFinite(v)?v.toFixed(2):'—'}</div><div class="bar-lbl">S${i}</div></div>`}).join('')}</div></div>`}).join('')}
function connect(){let ws=new WebSocket(`ws://${location.hostname||'localhost'}:9091`);ws.onopen=()=>{let s=document.getElementById('status');s.textContent='connected';s.className='ok'};ws.onclose=()=>{let s=document.getElementById('status');s.textContent='disconnected — retrying…';s.className='bad';setTimeout(connect,1500)};ws.onerror=()=>ws.close();ws.onmessage=e=>{latest=JSON.parse(e.data);if(latest.names&&latest.names.length===DOF&&latest.names.join()!=names.join()){names=latest.names;buildJointList()}history.push({time:Date.now(),position:latest.position,desired:latest.desired,current:latest.current,temperature:latest.temperature});let cut=Date.now()-WINDOW;while(history.length&&history[0].time<cut)history.shift();draw();renderPressure()}}
buildJointList();connect();window.onresize=draw;
</script></body></html>
